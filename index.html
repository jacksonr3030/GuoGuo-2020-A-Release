<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
        integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/index.css">
    <!-- 使用Font Awesome字体 -->
    <script src="https://kit.fontawesome.com/ab7fe88443.js" crossorigin="anonymous"></script>
</head>

<body>
    <!-- 弹出层对话框 -->
    <!-- model-dialog弹出层对话框， modal-dialog-centered对话框垂直居中-->
    <!-- text-center让其内部的图片，文字，按钮水平居中 -->
    <div class="model-dialog text-center">
        <div class="col-sm-8 main-section">
            <!-- 对话框内容部分 -->
            <div class="model-content">
                <div class="col-12 user-img">
                    <img src="./imgs/user-320X320.png">
                </div>

                <form class="col-12">
                    <div class="form-group username">
                        <input type="text" class="form-control" placeholder="Enter Username">
                    </div>
                    <div class="form-group password">
                        <input type="password" class="form-control" placeholder="Password">
                    </div>
                    <button type="submit" class="btn">
                        <i class="fas fa-sign-in-alt"></i>
                        Login
                    </button>
                </form>

                <div class="col-12 forgot">
                    <a href="#">Forget Password?</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
